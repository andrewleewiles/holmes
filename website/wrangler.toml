name = "holmes-website"
compatibility_date = "2025-01-01"

# custom_domain = true makes wrangler create the DNS records on the zone
# automatically; the zone (holmesai.org) is already on this Cloudflare account.
# NB: this must stay ABOVE [assets] — TOML would otherwise parse it as
# assets.routes, which wrangler silently ignores.
routes = [
  { pattern = "holmesai.org", custom_domain = true },
  { pattern = "www.holmesai.org", custom_domain = true },
]

# Static site only — no worker script. Cloudflare serves the files in this
# directory directly from its edge cache.
[assets]
directory = "."
html_handling = "auto-trailing-slash"
